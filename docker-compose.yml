services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-careflow_ai}
    ports:
      - "5432:5432"
    volumes:
      - careflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careflow_user} -d ${POSTGRES_DB:-careflow_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-careflow_user}:${POSTGRES_PASSWORD:-careflow_pass}@db:5432/${POSTGRES_DB:-careflow_ai}
      SECRET_KEY: ${SECRET_KEY:-default_secret_key_for_dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  careflow_pgdata:
