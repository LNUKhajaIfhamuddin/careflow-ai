version: 1.0
runtime: python311
build:
  commands:
    build:
      - echo "Build phase complete"
run:
  runtime-version: 3.11
  pre-run:
    - pip3 install -r backend/requirements.txt
    - python3 -m backend.app.seed
  command: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
